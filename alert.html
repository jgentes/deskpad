<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeting alert</title>
    <script type="module" src="/src/alert.ts" defer></script>
  </head>
  <body class="alert">
    <div class="alert-card">
      <div id="alert-countdown" class="alert-countdown">Starting soon</div>
      <h1 id="alert-title">Meeting</h1>
      <div id="alert-when" class="alert-when"></div>
      <div id="alert-loc" class="alert-loc"></div>
      <div class="alert-actions">
        <button id="alert-join" class="primary big" hidden>Join</button>
        <button id="alert-snooze-1" class="big">Snooze 1 min</button>
        <button id="alert-snooze-5" class="big">Snooze 5 min</button>
        <button id="alert-dismiss" class="big ghost">Dismiss</button>
      </div>
      <div class="alert-hint"><kbd>Enter</kbd> join · <kbd>Esc</kbd> dismiss</div>
    </div>
  </body>
</html>
