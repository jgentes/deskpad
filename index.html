<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deskpad</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body class="sidebar">
    <header class="bar" data-tauri-drag-region>
      <div class="clock">
        <div id="clock-time">--:--</div>
        <div id="clock-date"></div>
      </div>
      <div class="bar-actions">
        <button id="btn-capture" class="icon" title="Capture task (Ctrl+Space)" aria-label="Capture task">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <button id="btn-settings" class="icon" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
          </svg>
        </button>
        <button id="btn-hide" class="icon" title="Collapse to edge" aria-label="Collapse sidebar">
          <svg viewBox="0 0 24 24"><path d="M5 12h12M13 6l6 6-6 6" /><path d="M21 4v16" /></svg>
        </button>
      </div>
    </header>

    <section class="panel" id="meetings-panel">
      <div class="panel-head">
        <h2>Up next</h2>
        <button id="btn-refresh" class="icon small" title="Refresh calendar" aria-label="Refresh calendar">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4" /><path d="M21 3v6h-6" /></svg>
        </button>
      </div>
      <div id="meetings" class="list"></div>
    </section>

    <section class="panel grow" id="tasks-panel">
      <div class="panel-head">
        <h2>Tasks <span id="task-count" class="count"></span></h2>
        <button id="btn-clear-done" class="link" title="Remove completed tasks from the list" hidden>clear completed</button>
      </div>
      <form id="task-form" class="task-form">
        <input id="task-input" placeholder="Add a task…" autocomplete="off" />
      </form>
      <div id="tasks" class="list"></div>
    </section>

    <footer class="hint">
      <kbd>Ctrl</kbd> + <kbd>Space</kbd> captures from anywhere
    </footer>

    <div id="settings" class="modal hidden">
      <form id="settings-form" class="modal-card">
        <h2>Settings</h2>

        <fieldset>
          <legend>Google Calendar</legend>
          <div id="google-connected" class="google-row hidden">
            <span class="ok">● Connected</span>
            <button type="button" id="btn-google-disconnect">Disconnect</button>
          </div>
          <div id="google-disconnected">
            <label>
              OAuth client ID
              <input id="s-gid" placeholder="…apps.googleusercontent.com" />
            </label>
            <label>
              OAuth client secret
              <input id="s-gsecret" type="password" placeholder="GOCSPX-…" />
              <small>
                Create a <b>Desktop app</b> OAuth client in Google Cloud Console (APIs &amp; Services →
                Credentials) with the Calendar API enabled, then paste both values and connect.
                Shows all calendars you have checked in Google Calendar, with Meet join links.
              </small>
            </label>
            <button type="button" id="btn-google-connect" class="primary">Connect Google Calendar</button>
            <div id="google-error" class="error"></div>
          </div>
        </fieldset>

        <label>
          Calendar feed URL (.ics) <small>(used when Google is not connected)</small>
          <input id="s-ics" placeholder="https://calendar.google.com/calendar/ical/…/basic.ics" />
          <small>
            Google Calendar: Settings → your calendar → “Secret address in iCal format”.
            Outlook: Settings → Calendar → Shared calendars → Publish → ICS link.
          </small>
        </label>
        <label>
          Look ahead (hours)
          <input id="s-lookahead" type="number" min="1" max="336" />
        </label>
        <label>
          Sidebar width (px)
          <input id="s-width" type="number" min="240" max="600" />
        </label>
        <label class="check">
          <input id="s-reserve" type="checkbox" />
          Reserve screen space (maximized windows stop at the sidebar)
        </label>
        <label class="check">
          <input id="s-top" type="checkbox" />
          Always on top
        </label>
        <label class="check">
          <input id="s-autostart" type="checkbox" />
          Start Deskpad when I sign in to Windows
        </label>
        <div class="modal-actions">
          <button type="button" id="btn-quit" class="danger">Quit Deskpad</button>
          <span class="spacer"></span>
          <button type="button" id="btn-settings-cancel">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </div>
  </body>
</html>
